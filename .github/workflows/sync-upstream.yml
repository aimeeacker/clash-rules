name: Sync upstream master to fork

on:
  workflow_dispatch:
  schedule:
    # UTC+8 Friday 23:59 = UTC Friday 15:59
    - cron: "59 15 * * 5"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure upstream remote
        run: |
          git remote add upstream https://github.com/Loyalsoldier/clash-rules.git || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch upstream master
          git fetch upstream release
          git fetch origin master
          git checkout master

      - name: Sync upstream master into fork master (non-destructive)
        run: |
          if ! git merge --ff-only upstream/master; then
            echo "Fast-forward not possible, create merge commit to keep local history."
            if ! git merge --no-edit --allow-unrelated-histories upstream/master; then
              echo "Merge conflict detected. Auto-resolving workflow file conflicts by keeping fork version."
              mapfile -t conflict_files < <(git diff --name-only --diff-filter=U)

              for file in "${conflict_files[@]}"; do
                if [[ "${file}" =~ ^\.github/workflows/.*\.ya?ml$ ]]; then
                  if git cat-file -e "HEAD:${file}" 2>/dev/null; then
                    git checkout --ours -- "${file}"
                    git add -- "${file}"
                  else
                    git rm -f -- "${file}"
                  fi
                else
                  echo "Unexpected merge conflict in ${file}; aborting."
                  exit 1
                fi
              done

              if git ls-files -u | grep -q .; then
                echo "Unresolved merge conflicts remain; aborting."
                exit 1
              fi

              git commit --no-edit
            fi
          fi

      - name: Sync rule files from upstream release branch
        run: |
          RULE_FILES=(
            "apple.txt"
            "applications.txt"
            "cncidr.txt"
            "direct.txt"
            "gfw.txt"
            "google.txt"
            "greatfire.txt"
            "icloud.txt"
            "lancidr.txt"
            "private.txt"
            "proxy.txt"
            "reject.txt"
            "telegramcidr.txt"
            "tld-not-cn.txt"
          )

          for file in "${RULE_FILES[@]}"; do
            git show "upstream/release:${file}" > "${file}"
          done

          # Only create a commit if release rule files are changed.
          git add "${RULE_FILES[@]}"
          if ! git diff --cached --quiet -- "${RULE_FILES[@]}"; then
            git commit -m "chore: sync release rule snapshots to master"
          fi

      - name: Push upstream changes
        run: |
          if ! git diff --quiet origin/master; then
            git push origin master
          else
            echo "Master branch is already up to date."
          fi
